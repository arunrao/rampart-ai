name: Prompt-injection eval gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/models/prompt_injection_detector.py"
      - "backend/models/injection_*.py"
      - "backend/eval/**"
      - "backend/api/routes/scan.py"
      - ".github/workflows/injection-eval.yml"

# Least privilege for GITHUB_TOKEN; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (CPU torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Detector unit + API tests (no model)
        working-directory: backend
        run: python -m pytest tests/test_prompt_injection.py tests/test_injection_fail_closed.py tests/test_scan_injection_api.py -q

  gates:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (CPU torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Cache HF model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-deberta-injection-${{ hashFiles('backend/models/pinned_revisions.py') }}
      - name: Cache eval corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/eval/corpus
          key: eval-corpus-${{ hashFiles('backend/eval/fetch_corpus.py') }}
      - name: Fetch corpus
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python eval/fetch_corpus.py
      - name: Model-backed regression pins
        working-directory: backend
        env:
          RAMPART_MODEL_TESTS: "1"
          JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-characters!!
          KEY_ENCRYPTION_SECRET: ci-key-encryption-secret-32-chars!!
        run: python -m pytest tests/test_injection_regression.py -q
      - name: Eval with gates
        working-directory: backend
        env:
          JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-characters!!
          KEY_ENCRYPTION_SECRET: ci-key-encryption-secret-32-chars!!
        run: python eval/run_eval.py --profiles natural --gates --tag ci
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: injection-eval-report
          path: backend/eval/results/*.md

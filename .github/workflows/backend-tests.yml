name: Backend tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

env:
  SECRET_KEY: ci-secret-key-minimum-32-characters!!!!
  JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-characters!!
  KEY_ENCRYPTION_SECRET: ci-key-encryption-secret-32-chars!!
  ENVIRONMENT: test

# Least privilege for GITHUB_TOKEN; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        # Only used by the postgres matrix leg; harmless for sqlite.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rampart
          POSTGRES_PASSWORD: rampart
          POSTGRES_DB: rampart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rampart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Install into backend/venv so pyrightconfig.json (venvPath/venv) resolves the
      # same interpreter locally and in CI.
      - name: Install (CPU torch)
        working-directory: backend
        run: |
          python -m venv venv
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          ./venv/bin/pip install -r requirements.txt
      - name: Type check (pyright)
        if: matrix.db == 'sqlite'
        run: |
          pip install "pyright==1.1.414"
          pyright
      - name: Select database
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then
            echo "DATABASE_URL=postgresql://rampart:rampart@localhost:5432/rampart_test" >> "$GITHUB_ENV"
          fi
      - name: Migrations apply cleanly and match the models
        working-directory: backend
        run: |
          python -m api.migrate
          python -m api.migrate --check
          alembic check
      - name: Migrations round-trip (downgrade to base, upgrade to head)
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
